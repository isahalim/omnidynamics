<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The monogram as the header wears it: a ring with a stem a third of the
       way across, the ring's own right side standing in for the D's bowl.

       The mark's own ink on the site's own plaster, opaquely, rather than
       following the chrome from black to white: Safari does not resolve
       `prefers-color-scheme` inside a favicon, and Google's result rows, the
       tab strip and the bookmark bar all composite a transparent mark onto
       whatever ground they like — which is how the white-on-nothing copy came
       to show as a white disc in a dark search result. Carrying the wall means
       the mark reads the same everywhere, and reads as this site. It is what
       the PNG fallbacks are drawn on too. See `scripts/build-icons.mjs`. -->
  <rect width="100" height="100" fill="#d2ccc2"/>
  <g fill="none" stroke="#16130f" stroke-width="9.5" stroke-linecap="round" transform="translate(50 50) scale(0.62) translate(-50 -50)">
    <circle cx="50" cy="50" r="45"/>
    <line x1="28.4" y1="10.52" x2="28.4" y2="89.48"/>
  </g>
</svg>
