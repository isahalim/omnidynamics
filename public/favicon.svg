<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The monogram as the header wears it: a ring with a stem a third of the
       way across, the ring's own right side standing in for the D's bowl. Black
       on the browser's light chrome, white on its dark. -->
  <style>
    :root { color: #0d0d0f; }
    @media (prefers-color-scheme: dark) { :root { color: #f4f4f6; } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="9.5" stroke-linecap="round">
    <circle cx="50" cy="50" r="45"/>
    <line x1="28.4" y1="10.52" x2="28.4" y2="89.48"/>
  </g>
</svg>
