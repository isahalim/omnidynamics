name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` validates every WGSL entry against a real device before
      # it builds. CI runners have no GPU, so vgpu's portable CPU renderer is
      # what makes that check runnable here.
      - name: Install WebGPU software renderer
        run: npx --no -- vgpu install-software-renderer

      # Repository *variables*, not secrets, and deliberately so: every one of
      # these is compiled into the bundle and served to readers. A Google OAuth
      # client id is an identifier, not a credential, and a booking link is a
      # URL. Unset, the site still builds: the sign-in and the booking page say
      # they are not connected rather than failing at the first click.
      # See `.env.example`.
      - name: Build
        env:
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_CAL_LINK: ${{ vars.PUBLIC_CAL_LINK }}
          PUBLIC_CAL_ORIGIN: ${{ vars.PUBLIC_CAL_ORIGIN }}
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://omnidynamics.isahalim.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` validates every WGSL entry against a real device before
      # it builds. CI runners have no GPU, so vgpu's portable CPU renderer is
      # what makes that check runnable here.
      - name: Install WebGPU software renderer
        run: npx --no -- vgpu install-software-renderer

      # Repository *variables*, not secrets, and deliberately so: every one of
      # these is compiled into the bundle and served to readers. A Google OAuth
      # client id is an identifier, not a credential, and a booking link is a
      # URL. Unset, the site still builds: the sign-in and the booking page say
      # they are not connected rather than failing at the first click.
      # See `.env.example`.
      - name: Build
        env:
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_CAL_LINK: ${{ vars.PUBLIC_CAL_LINK }}
          PUBLIC_CAL_ORIGIN: ${{ vars.PUBLIC_CAL_ORIGIN }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
