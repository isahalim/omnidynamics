# The identity provider, self-hosted.
#
# Everything the site knows about who is signing in comes from this stack, and
# everything this stack knows about itself comes from `blueprints/` — the
# application, the OAuth client, the Google source and the flow that jumps
# straight to it are all declared there rather than clicked into the admin
# interface, so a fresh machine is `up -d` away from the deployment that is
# running now.
#
# The project name is pinned so the Postgres volume keeps its name across
# moves: `authentik_database` is the database, and it is the only state here
# that matters. `./data` is uploaded media, `./certs` the signing keys.
name: authentik

x-authentik: &authentik
  image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.2}
  restart: unless-stopped
  shm_size: 512mb
  env_file: [.env]
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
    AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
    AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    # Read by `!Env` in blueprints/omnidynamics.yaml. Unset is not an error:
    # the Google source is created disabled and the site hides the button.
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # The site's public OAuth client id. Not a secret — it ships in the
    # bundle — but it has to be the same string on both sides, so it is named
    # once here and once in the site's PUBLIC_OIDC_CLIENT_ID.
    OMNIDYNAMICS_CLIENT_ID: ${OMNIDYNAMICS_CLIENT_ID:?public OAuth client id required}
  depends_on:
    postgresql:
      condition: service_healthy

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - database:/var/lib/postgresql/data

  server:
    <<: *authentik
    command: server
    ports:
      - ${COMPOSE_PORT_HTTP:-9000}:9000
      - ${COMPOSE_PORT_HTTPS:-9443}:9443
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      # Discovered recursively under /blueprints. The worker is what applies
      # them; the server mounts them too so the admin interface can show what
      # a file declares next to what the database holds.
      - ./blueprints:/blueprints/custom:ro

  worker:
    <<: *authentik
    command: worker
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      - ./blueprints:/blueprints/custom:ro

volumes:
  database:
    driver: local
